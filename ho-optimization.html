<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hand-over optimization with XGboost and reinforcement learning.">
  <title>Hand-over Optimization</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111a2e;
      --line: #24314f;
      --ink: #e8ecf5;
      --ink-dim: #9aa7c2;
      --teal: #5ed3c8;
      --amber: #ffb454;
      --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
      --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      color: var(--ink);
      background:
        radial-gradient(900px 520px at 10% -10%, #14213f 0%, transparent 60%),
        radial-gradient(800px 500px at 100% 5%, #101a35 0%, transparent 58%),
        var(--bg);
      font-family: var(--serif);
    }

    main {
      width: min(680px, 100%);
      padding: 2.2rem 2.4rem;
      text-align: center;
      background: rgba(17, 26, 46, 0.94);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.2);
    }

    .tag {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.22rem 0.55rem;
      color: var(--teal);
      background: rgba(94, 211, 200, 0.08);
      border: 1px solid rgba(94, 211, 200, 0.24);
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 0.8rem;
      font-size: clamp(2rem, 6vw, 3.4rem);
      font-weight: 500;
      line-height: 1.08;
    }

    .subtitle {
      margin: 0 0 1.8rem;
      color: var(--ink-dim);
      font-size: 1.05rem;
    }

    .message {
      margin: 0;
      padding-top: 1.4rem;
      color: var(--amber);
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="tag">LTE/5G · AI/ML</div>
    <h1>Hand-over Optimization</h1>
    <p class="subtitle">Hand-over optimization with XGboost and RL</p>
    <p class="message">Please contact us for details.</p>
  </main>
</body>
</html>
